name: no-drift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  converter:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Converter self-test
        run: python scripts/toast.py selftest

      - name: Bundled agents round-trip byte-identical
        shell: bash
        run: |
          set -euo pipefail
          python scripts/toast.py roundtrip assets/hello_rapp_agent.py
          python scripts/toast.py roundtrip examples/hacker-news/hacker_news_agent.py

      - name: Committed projection is cross-version deterministic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fixture"
          python scripts/toast.py convert \
            examples/hacker-news/hacker_news_agent.py --to skill \
            -o "$RUNNER_TEMP/fixture/SKILL.md"
          python -c "from pathlib import Path; assert Path('examples/hacker-news/SKILL.md').read_bytes() == Path(r'$RUNNER_TEMP/fixture/SKILL.md').read_bytes()"

      - name: Projection emits a byte-exact linked agent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pair"
          python scripts/toast.py convert assets/hello_rapp_agent.py \
            --to skill -o "$RUNNER_TEMP/pair/SKILL.md"
          python -c "from pathlib import Path; assert Path('assets/hello_rapp_agent.py').read_bytes() == Path(r'$RUNNER_TEMP/pair/hello_rapp_agent.py').read_bytes()"
          python "$RUNNER_TEMP/pair/hello_rapp_agent.py" --tool >/dev/null

      - name: Capsule restores when the linked file is missing
        shell: bash
        run: |
          set -euo pipefail
          rm "$RUNNER_TEMP/pair/hello_rapp_agent.py"
          python scripts/toast.py convert "$RUNNER_TEMP/pair/SKILL.md" \
            --to agent -o "$RUNNER_TEMP/restored.py"
          python -c "from pathlib import Path; assert Path('assets/hello_rapp_agent.py').read_bytes() == Path(r'$RUNNER_TEMP/restored.py').read_bytes()"

      - name: Root launchers contain no second engine
        shell: bash
        run: |
          set -euo pipefail
          python toast.py --help >/dev/null
          python toaster.py --help >/dev/null
          test "$(grep -c '^def ' toast.py || true)" = "0"
          test "$(grep -c '^def ' toaster.py || true)" = "0"
